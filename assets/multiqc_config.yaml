title: "SAGFlow quality-control report"
subtitle: "Single-amplified genome analysis"
intro_text: >-
  This report summarises read QC, competitive mapping, SAG assembly, genome
  quality, contamination screening, and taxonomy. Missing values are not
  interpreted as negative biological evidence.
